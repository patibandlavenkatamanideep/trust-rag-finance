name: nightly-ingest-and-eval

# "Eval is always-on infrastructure" — re-ingest the live corpus and run the
# 7-metric deploy gate every night, plus on every push/PR. Keeps the project
# honest: a regression in groundedness / citation validity / false-confident
# rate fails the job.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC nightly
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Ingest corpus + run eval gate (extractive, no API)
        run: |
          python scripts/ingest.py data/research_reports || python scripts/ingest.py data/sample_docs
          python scripts/run_eval.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: data/eval_results/latest.json
          if-no-files-found: ignore
