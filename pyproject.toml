[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-rag-finance"
version = "0.1.0"
description = "Evaluation-driven, read-only wealth research RAG assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32"]
llm = ["anthropic>=0.40", "openai>=1.30"]
ml = ["sentence-transformers>=2.6"]
ingest = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3", "mypy>=1.9"]

# Monorepo: discover the importable packages across packages/* and apps/api.
[tool.setuptools.packages.find]
where = [
    "packages/shared",
    "packages/ingestion",
    "packages/retrieval",
    "packages/synthesis",
    "packages/verification",
    "packages/evals",
    "packages/audit",
    "apps/api",
]

[tool.pytest.ini_options]
pythonpath = [
    "packages/shared",
    "packages/ingestion",
    "packages/retrieval",
    "packages/synthesis",
    "packages/verification",
    "packages/evals",
    "packages/audit",
    "apps/api",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
